name: MiHoYo Sign-In Script

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Run script and Notify Discord
      env:
        MYS_COOKIES: ${{ secrets.MYS_COOKIES }}
        GENSHIN_TOKENS: ${{ secrets.GENSHIN_TOKENS }}
        STARRAIL_TOKENS: ${{ secrets.STARRAIL_TOKENS }}
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        DISCORD_USER_ID: "571659139596419122"
      run: |
        node main.js > log.txt 2>&1
        
        # Extract Genshin logs
        awk '/\[Genshin\] Start/,/\[Genshin\] Sign-in completed/' log.txt > genshin.log
        LOG_TEXT=$(cat genshin.log)
        
        # Determine status, embed color, and mention tag
        if grep -q -E "已签到|already|-5003" genshin.log; then
          DESC="[自動簽到] 原神今日已完成簽到。"
          COLOR=16776960 # Yellow
          TAG="<@${DISCORD_USER_ID}>"
        elif grep -q -E "失效|not logged in|-100" genshin.log; then
          DESC="[自動簽到] 登入狀態失效，請重新設定 Cookie。"
          COLOR=16711680 # Red
          TAG="<@${DISCORD_USER_ID}>"
        elif grep -q -E "OK|Sign-in successful|success" genshin.log; then
          DESC="[自動簽到] 原神今日簽到成功。"
          COLOR=5793266 # Discord Blue
          TAG="<@${DISCORD_USER_ID}>"
        else
          DESC="[自動簽到] 未知狀態，請前往 GitHub Actions 檢查詳細日誌。"
          COLOR=8421504 # Gray
          TAG="<@${DISCORD_USER_ID}>"
        fi
        
        # Generate JSON payload using Embeds with Raw Logs
        jq -n \
          --arg tag "$TAG" \
          --arg desc "$DESC" \
          --arg logs "$LOG_TEXT" \
          --arg color "$COLOR" \
          '{
            username: "簽到小幫手",
            content: $tag,
            embeds: [{
              description: ($desc + "\n\n**Raw Logs:**\n```text\n" + $logs + "\n```"),
              color: ($color | tonumber)
            }]
          }' > payload.json
          
        # Send to Discord Webhook
        curl -H "Content-Type: application/json" -d @payload.json $DISCORD_WEBHOOK
