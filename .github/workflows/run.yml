name: MiHoYo Sign-In Script

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Run script and Notify Discord
      env:
        MYS_COOKIES: ${{ secrets.MYS_COOKIES }}
        GENSHIN_TOKENS: ${{ secrets.GENSHIN_TOKENS }}
        STARRAIL_TOKENS: ${{ secrets.STARRAIL_TOKENS }}
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        DISCORD_USER_ID: "571659139596419122"
      run: |
        node main.js > log.txt 2>&1
        
        awk '/\[Genshin\] Start/,/\[Genshin\] Sign-in completed/' log.txt > genshin.log
        
        CURRENT_TIME=$(TZ='Asia/Hong_Kong' date '+%Y-%m-%d %H:%M:%S')
        
        if grep -q -E "已签到|already|-5003" genshin.log; then
          STATUS="⚠️ Already Signed In"
          TAG=""
        elif grep -q -E "失效|not logged in|-100" genshin.log; then
          STATUS="❌ Login Status Lost (Cookie Expired)"
          TAG="<@${DISCORD_USER_ID}> "
        elif grep -q -E "OK|Sign-in successful|success" genshin.log; then
          STATUS="✅ Sign-in Successful"
          TAG=""
        else
          STATUS="❓ Unknown Status"
          TAG="<@${DISCORD_USER_ID}> "
        fi
        
        LOG_TEXT=$(cat genshin.log)
        
        jq -n \
          --arg msg "${TAG}Genshin Sign-In Report" \
          --arg status "$STATUS" \
          --arg time "$CURRENT_TIME" \
          --arg logs "$LOG_TEXT" \
          '{content: ($msg + "\n**Status**: " + $status + "\n**Time**: " + $time + "\n**Logs**:\n```text\n" + $logs + "\n```")}' > payload.json
          
        curl -H "Content-Type: application/json" -d @payload.json $DISCORD_WEBHOOK
